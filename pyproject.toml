[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightseam"
version = "0.5.0"
description = "A bounded duplex peer and descriptor validator over framed connections"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["websockets>=15,<18"]

[project.optional-dependencies]
test = ["build>=1.2,<2", "ruff>=0.14,<1"]

[tool.setuptools]
packages = ["nightseam.duplex", "nightseam.runtime"]

[tool.setuptools.package-dir]
"nightseam.duplex" = "duplex/py/nightseam/duplex"
"nightseam.runtime" = "runtime/py/nightseam/runtime"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
