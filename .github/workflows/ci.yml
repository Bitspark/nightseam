# Two tiers. The fast one is the model, every target's Check and the golden
# output under cmd/nightseam/testdata: it needs Go alone and runs in seconds.
# The full one hands the generated packages to their toolchains — go test,
# tsc, node — and runs the TypeScript packages' own checks and tests; a
# toolchain it needs and does not find fails it rather than skipping.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    # The fast tier runs on Windows too: the fixtures are byte comparisons
    # and the diagnostics carry slash paths, which is where a platform
    # difference would show.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Formatting is a gate and not a convention: .gitattributes keeps every
      # checkout at LF so that this answer is the same on every platform.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -short ./...
      # The root module's ./... does not enter a nested module, so the
      # OpenTelemetry adapter is vetted and tested where it lives. It is in
      # both tiers because it is held to the runtime it binds to, and a
      # runtime change that breaks it should fail the pull request that made
      # it and not the release that carries it.
      - run: go vet ./...
        working-directory: otel/go
      - run: go test ./...
        working-directory: otel/go

  # The rules on main are a file, .github/ruleset-main.json, and this job
  # fails when the live ruleset has drifted from it — a required check
  # removed by a click, a bypass added by hand — so that the drift fails the
  # next pull request rather than the release that finds a gate missing.
  # Reading a ruleset needs no permission beyond the default token's.
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/protect-main.mjs check
        env:
          GH_TOKEN: ${{ github.token }}

  # What a pull request says about itself: it closes one issue that has a
  # milestone, its title is the commit it will become, it carries no trailer;
  # and a scope note, never a refusal, where the files it changes leave the
  # issue's Touches. On a push to main there is no PR and the job is skipped.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/pr-scope.mjs "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r check
      # The packages are built here and not only at a tag, so that a
      # tsconfig.build.json that stopped emitting fails a pull request rather
      # than a release.
      - run: pnpm -r build
      - run: pnpm -r test
      - run: go test ./...
      # The conformance suite is in go test ./... above; it is run again by
      # name so that a failure of the matrix reads as one, and its
      # matrix.json is kept as the run's artifact.
      - run: go test ./conformance/go -run 'TestSelf|TestStar|TestGenerated' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-matrix
          path: conformance/matrix.json
      # The scripts that read the matrix — the README's table and the release
      # gate — hold themselves first, on fixture matrices no run has produced
      # yet, since a gate first exercised by the release it refuses is a gate
      # nobody has run.
      - run: node --test 'scripts/*.test.mjs'
      # The README's Languages table against the matrix the step above just
      # wrote, as `nightseam check` holds generated output: a table that
      # drifted fails the pull request that drifted it. This catches a stale
      # checked-in matrix.json too — the table is rendered from the committed
      # file and compared against the regenerated one, so a run that moved a
      # cell shows up here whether or not the file was committed with it.
      - run: node scripts/matrix-table.mjs --check
      # Every link in every tracked Markdown page resolves to the tree — a
      # file, a directory, a heading — including the repository's own
      # absolute URLs, which the package READMEs use so as to render on npm.
      # A page moved without its inbound links fails the pull request that
      # moved it, rather than a reader some weeks later.
      - run: node scripts/links.mjs
      # The getting-started example's checked-in generated output, held the
      # way a consumer's is. The example is a Go module and a pnpm project
      # of its own, so neither `go test ./...` above nor `pnpm -r` enters it.
      - run: go run ./cmd/nightseam --root examples/probe check
      # The one gate that asks whether what is published can be installed:
      # every package packed, the example installed from the tarballs and
      # from a file:// module proxy outside the workspace, then built and
      # run. It is here and not only at a tag so that the example is held by
      # every pull request, and so that a packaging change fails the change
      # rather than the release that carries it. RELEASING.md says what it
      # does not answer.
      - run: node scripts/smoke-packed.mjs
      - run: go vet ./...
        working-directory: otel/go
      - run: go test ./...
        working-directory: otel/go
