# Two tiers. The fast one is the model, every target's Check and the golden
# output under cmd/nightseam/testdata: it needs Go alone and runs in seconds.
# The full one hands the generated packages to their toolchains — go test,
# tsc, node — and runs the TypeScript packages' own checks and tests; a
# toolchain it needs and does not find fails it rather than skipping.
name: ci

on:
  push:
    branches: [main]
  # edited is among them because scope reads the pull request's body: the
  # fix for a scope refusal is to write Closes #N there, and an edit that
  # reached no workflow left the check red on a PR that satisfied it.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  fast:
    # The fast tier runs on Windows too: the fixtures are byte comparisons
    # and the diagnostics carry slash paths, which is where a platform
    # difference would show.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      # The scripts before the tiers that run them, on both platforms and in
      # the first minute: every one loads, the script tests hold — the
      # release gate and the round trip on fixture registries and matrices
      # no run has produced yet — and every link, every documented page and
      # the README's table hold. A script that does not load, or a step
      # nothing exercised, is otherwise found by the run that needs it,
      # which for the round trip is after the upload (#611, #613).
      - name: Every script a workflow runs loads
        shell: bash
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
          for script in $(grep -ho 'scripts/[A-Za-z0-9_-]*\.mjs' .github/workflows/*.yml | sort -u); do
            test -f "$script" || { echo "::error::$script is named by a workflow and is not in the tree" >&2; exit 1; }
          done
      # On Linux: four script tests do not hold on the Windows runner yet —
      # the import smokes' tsc invocation and a temp directory the worktree
      # test cannot remove (#624) — and the fast tier is what Windows is for.
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'Linux'
      - run: node --test 'scripts/*.test.mjs'
        if: runner.os == 'Linux'
      - run: node scripts/matrix-table.mjs --check
        if: runner.os == 'Linux'
      - run: node scripts/links.mjs
        if: runner.os == 'Linux'
      - run: node scripts/docs.mjs
        if: runner.os == 'Linux'
      # A name this tree would publish for the first time is said on the
      # pull request, where the lane that added it reads it, rather than
      # found by the release lane (RELEASING.md, *A name npm has not
      # served*). It asks the public registry and decides nothing, so a
      # registry that does not answer does not fail the change.
      - name: Name a first publish on the pull request
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          node scripts/first-publish.mjs | tee first-publish.txt
          grep '^first publish:' first-publish.txt | sed 's/^/::notice title=first publish::/' || true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Formatting is a gate and not a convention: .gitattributes keeps every
      # checkout at LF so that this answer is the same on every platform.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -short ./...
      # The root module's ./... does not enter a nested module, so the
      # OpenTelemetry adapter and the authority profile are vetted and tested
      # where they live. They are in both tiers because they are held to the
      # runtime they bind to, and a runtime change that breaks one should
      # fail the pull request that made it and not the release that carries
      # it.
      - run: go vet ./...
        working-directory: otel/go
      - run: go test ./...
        working-directory: otel/go
      - run: go vet ./...
        working-directory: auth/go
      - run: go test ./...
        working-directory: auth/go

  # The rules on main are a file, .github/ruleset-main.json, and this job
  # fails when the live ruleset has drifted from it — a required check
  # removed by a click, a bypass added by hand — so that the drift fails the
  # next pull request rather than the release that finds a gate missing.
  # Reading a ruleset needs no permission beyond the default token's.
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/protect-main.mjs check
        env:
          GH_TOKEN: ${{ github.token }}

  # What a pull request says about itself: it closes one issue that has a
  # milestone, its title is the commit it will become, it carries no trailer;
  # and a scope note, never a refusal, where the files it changes leave the
  # issue's Touches. On a push to main there is no PR and the job is skipped.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/pr-scope.mjs "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 --retry-delay 5 https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.1.3"
      - run: node scripts/swift.mjs

  full:
    needs: swift
    if: always()
    runs-on: ubuntu-latest
    env:
      NIGHTSEAM_MATRIX_SUMMARY: ${{ github.workspace }}/conformance-summary.md
    steps:
      - name: Require the Swift package gate
        if: needs.swift.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: '3.7.1'
      - uses: actions/cache@v4
        with:
          path: ~/.stack
          key: haskell-${{ runner.os }}-9.6.7-${{ hashFiles('conformance/haskell/stack.yaml.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 --retry-delay 5 https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.1.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Python unit suites
        run: |
          python -m ruff check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m ruff format --check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m unittest discover -s duplex/py/tests
          python -m unittest discover -s runtime/py/tests
          python -m unittest discover -s conformance/python -p 'test_*.py'
      - name: Python installed wheel
        run: python scripts/smoke-python.py
      - run: pnpm install --frozen-lockfile
      - name: Install the C++ core toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Build and test the C++ core
        run: |
          cmake -S . -B .build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build .build/cpp --parallel 2
          ctest --test-dir .build/cpp --output-on-failure
      - run: pnpm format:check
      - run: pnpm -r check
      # The packages are built here and not only at a tag, so that a
      # tsconfig.build.json that stopped emitting fails a pull request rather
      # than a release.
      - run: pnpm -r build
      - run: pnpm -r test
      - run: stack --system-ghc --no-install-ghc --stack-yaml conformance/haskell/stack.yaml test
      - run: node scripts/haskell-smoke.mjs
      # Hold the committed README to its committed evidence before the new
      # run writes fresh cells. A provisional cell must be reported without
      # becoming a second, stricter gate through a changed README count.
      - run: node scripts/matrix-table.mjs --check
      # Eight native testee builds and the complete star need an overall
      # budget beyond the default ten minutes; each build retains its own
      # five-minute deadline in conformance/go/build.go.
      - run: go test -timeout 25m ./...
      # The conformance suite is in go test ./... above; it is run again by
      # name so that a failure of the matrix reads as one, and its
      # matrix.json is kept as the run's artifact.
      - run: go test -v -timeout 25m ./conformance/go -run 'TestSelf|TestStar|TestGenerated' -count=1
      - name: Publish the conformance matrix, provisional cells and absent testees
        if: always()
        run: |
          if [ -f "$NIGHTSEAM_MATRIX_SUMMARY" ]; then
            cat "$NIGHTSEAM_MATRIX_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The conformance run produced no matrix summary; inspect the setup or test failure above.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-matrix
          path: conformance/matrix.json
      # The script tests, every link in every tracked Markdown page — a
      # file, a directory, a heading, the repository's own absolute URLs the
      # package READMEs use so as to render on npm — and every documented
      # page's row in its set's index run in the fast job above, on both
      # platforms and before any tier, where a page moved without its
      # inbound links or a page added without a row (as the Unicode decision
      # was from #182 until #303) fails the pull request in its first minute.
      # The getting-started example's checked-in generated output, held the
      # way a consumer's is. The example is a Go module and a pnpm project
      # of its own, so neither `go test ./...` above nor `pnpm -r` enters it.
      - run: go run ./cmd/nightseam --root examples/probe check
      # The one gate that asks whether what is published can be installed:
      # every package packed, the example installed from the tarballs and
      # from a file:// module proxy outside the workspace, then built and
      # run. It is here and not only at a tag so that the example is held by
      # every pull request, and so that a packaging change fails the change
      # rather than the release that carries it. RELEASING.md says what it
      # does not answer.
      # Prepare the same package notices the release includes; the smoke
      # refuses any tarball missing them, including during a local run.
      - run: node --input-type=module -e "import { copyNotices } from './scripts/packages.mjs'; copyNotices();"
      - run: node scripts/smoke-packed.mjs
      - run: node scripts/smoke-rust-packed.mjs
      - run: go vet ./...
        working-directory: otel/go
      - run: go test ./...
        working-directory: otel/go
      - run: go vet ./...
        working-directory: auth/go
      - run: go test ./...
        working-directory: auth/go
