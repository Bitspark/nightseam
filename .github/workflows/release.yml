# A release is a tag: v<major.minor.patch>, pushed. The workflow holds every
# spelling of the version to the tag, runs both tiers, builds the TypeScript
# packages, publishes them to the @nightseam organization with provenance —
# through the `release` environment, whose required reviewer approves every
# run, and with the NPM_TOKEN secret only while a name has no trusted
# publisher yet, which is its first publish — and creates the GitHub
# release with the tag's changelog section as its notes. The Go module needs
# no upload: the tag is its release, and so is the second tag that releases
# the nested module. Nothing here runs on a push to a branch. RELEASING.md
# says how a release is cut.
#
# The same steps run on demand without publishing anything, so that a release
# is rehearsed rather than attempted: everything that can fail — the versions
# against the tag, both tiers, the build, what provenance requires, and the
# publish itself as a dry run — fails on a run somebody asked for, rather
# than on the one that follows a tag that already exists and cannot be taken
# back.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version to rehearse, e.g. v0.3.0. Nothing is published and no release is created."
        required: true

permissions:
  contents: write
  # npm provenance: the publish signs each tarball with a short-lived OIDC
  # token naming this workflow, this run and this commit, so that the npm page
  # says what source the package was built from and a consumer can check it
  # rather than take it. This permission is the whole of what the workflow
  # needs for it; the rest is the repository being public.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Every run, a tag's or a rehearsal's, waits here for the reviewer the
    # environment names before a step runs.
    environment: release
    env:
      # The tag being released, or the one being rehearsed. Every step reads
      # this rather than the ref, which on a rehearsal is a branch.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the tags alone: a tier 2 language is
          # allowed one release of lag, and whether this release is the
          # second it has failed in is read off the previous tag's
          # conformance/matrix.json. A shallow checkout carries no tag to
          # read, and the gate would let a second failure through as a first.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Every spelling of the version against the tag, and the conformance
      # matrix against the tier table: a red cell in a profile the language's
      # tier guarantees refuses the tag here, before anything is published,
      # and a language the table ships as provisional is written into the
      # notes. The matrix read is the one committed on the tag — the standing
      # the release is cut at — and the suite runs below, so a tree that
      # cannot pass fails the tag anyway.
      - name: Hold the versions and the matrix to the tag
        run: node scripts/release-prepare.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r test
      - run: go test ./...
      # The adapter at otel/go is a module of its own, released by a second
      # tag beside this one; the tag is cut on a tree where it is green too.
      - run: go test ./...
        working-directory: otel/go
      - run: pnpm -r build
      # Provenance is refused for a package published from a private
      # repository, and the registry refuses it at the upload — which is
      # after the tag exists and after four of these steps have passed. It is
      # one fact and it is known here, so it is checked here, before anything
      # is published and on a rehearsal as well.
      - name: Check what provenance needs
        run: |
          visibility='${{ github.event.repository.visibility }}'
          if [ "$visibility" != public ]; then
            echo "::error::the repository is $visibility; npm provenance requires a public one — see the going-public list in RELEASING.md" >&2
            exit 1
          fi
          echo "public repository and id-token: write — provenance can be minted"
      # What is about to be published, installed from outside the workspace
      # by the getting-started example: the tarballs by path and the Go
      # module from a proxy laid out of this tree. It runs on a rehearsal as
      # well as on a tag, needs no registry and no tag of its own, and is
      # the last thing between a green tree and an upload that cannot be
      # taken back.
      - name: Install what is about to be published
        run: node scripts/smoke-packed.mjs
      - name: Publish to npm
        # On a rehearsal this packs each tarball, mints the provenance
        # attestation and stops short of the upload.
        run: pnpm -r publish --access public --no-git-checks --provenance $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
      - name: Create the GitHub release
        if: github.event_name == 'push'
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # The round trip, once there is something to install: the same
      # example, from npm and from the module proxy, with nothing laid for
      # it and nothing overridden. Its failure fails the run and files an
      # issue naming the tag, because by now the tag exists and the packages
      # are on npm, and a red run on a tag nobody re-runs is silence.
      - name: The round trip against what was published
        if: github.event_name == 'push'
        run: node scripts/smoke-registry.mjs "$TAG" --open-issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: What a rehearsal did not do
        if: github.event_name == 'workflow_dispatch'
        run: echo "rehearsed $TAG — nothing was published, no release was created, and the round trip against the registries did not run"
