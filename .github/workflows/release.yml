# A release is a tag: v<major.minor.patch>, pushed. The workflow holds every
# spelling of the version to the tag, runs both tiers, builds the TypeScript
# packages, publishes them to the @nightseam organization with provenance —
# through the `release` environment, whose required reviewer approves every
# run, and with the NPM_TOKEN secret only while a name has no trusted
# publisher yet, which is its first publish — makes the round trip against
# what it published, and creates the GitHub release with the tag's changelog
# section as its notes. The Go module needs no upload: the tag is its
# release, and so is the tag that releases each nested module. Nothing here
# runs on a push to a branch. RELEASING.md says how a release is cut.
#
# The same steps run on demand without publishing anything, so that a release
# is rehearsed rather than attempted: everything that can fail — the versions
# against the tag, both tiers, the build, what provenance requires, and the
# publish itself as a dry run — fails on a run somebody asked for, rather
# than on the one that follows a tag that already exists and cannot be taken
# back.
#
# What can refuse a release and costs seconds is asked first, in a job that
# waits on no reviewer and installs no toolchain: the tag against the
# checkout, the versions and the matrix against the tag, which names are a
# first publish, whether provenance can be minted, whether every script a
# workflow runs loads, and the script tests. A doomed run fails there, in
# its first minutes, with nothing to approve — the v0.6.0 publication spent
# forty minutes in toolchains and tiers before two seconds-cheap defects of
# its own scripts were found (#611, #613).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version to rehearse, e.g. v0.3.0. Nothing is published and no release is created."
        required: true

permissions:
  contents: write
  # The registry round trip files an issue if the published release fails.
  issues: write
  # npm provenance: the publish signs each tarball with a short-lived OIDC
  # token naming this workflow, this run and this commit, so that the npm page
  # says what source the package was built from and a consumer can check it
  # rather than take it. This permission is the whole of what the workflow
  # needs for it; the rest is the repository being public.
  id-token: write

env:
  # The tag being released, or the one being rehearsed. Every step reads
  # this rather than the ref, which on a rehearsal is a branch.
  TAG: ${{ inputs.tag || github.ref_name }}
  REQUIRE_TAG: ${{ github.event_name == 'push' && '--require' || '' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the tags alone: the release gate reads the
          # previous tag's conformance/matrix.json, and a shallow checkout
          # carries no tag to read.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Hold the remote tag to the checked-out commit
        run: node scripts/release-tag.mjs "$TAG" $REQUIRE_TAG
      # Every spelling of the version against the tag, and the conformance
      # matrix against the tier table: a red cell in a profile the language's
      # tier guarantees refuses the tag here, before anything is installed.
      # Nothing is written; the release job writes the notes.
      - name: Hold the versions and the matrix to the tag
        run: node scripts/release-prepare.mjs "$TAG" --dry-run
      # Whether npm has ever served each of the names this release publishes.
      # A name it has not cannot authenticate by OIDC, and `pnpm -r publish`
      # reaches such a name after the tag is pushed and after the names before
      # it are already uploaded. Said here so the operator reads it before
      # approving; the release job refuses a tag whose new name has no
      # credential. RELEASING.md, *A name npm has not served*.
      - name: Ask npm which names are a first publish
        run: node scripts/first-publish.mjs
      # Provenance is refused for a package published from a private
      # repository, and the registry refuses it at the upload. It is one fact
      # and it is known here.
      - name: Check what provenance needs
        run: |
          visibility='${{ github.event.repository.visibility }}'
          if [ "$visibility" != public ]; then
            echo "::error::the repository is $visibility; npm provenance requires a public one — see the going-public list in RELEASING.md" >&2
            exit 1
          fi
          echo "public repository and id-token: write — provenance can be minted"
      # A script that does not load fails the step that runs it, which on a
      # tag run is after the tiers and, for the round trip, after the upload.
      - name: Every script a workflow runs loads
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
          for script in $(grep -ho 'scripts/[A-Za-z0-9_-]*\.mjs' .github/workflows/*.yml | sort -u); do
            test -f "$script" || { echo "::error::$script is named by a workflow and is not in the tree" >&2; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      # The scripts that release, on fixture registries and matrices no run
      # has produced yet, since a gate first exercised by the release it
      # refuses is a gate nobody has run.
      - run: node --test 'scripts/*.test.mjs'
      - run: pnpm format:check
      - run: node scripts/matrix-table.mjs --check
      - run: node scripts/links.mjs
      - run: node scripts/docs.mjs

  release:
    needs: preflight
    runs-on: ubuntu-latest
    # Every run, a tag's or a rehearsal's, waits here for the reviewer the
    # environment names before a step runs — after preflight, so that what is
    # approved has already passed everything cheap.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the tags alone: a tier 2 language is
          # allowed one release of lag, and whether this release is the
          # second it has failed in is read off the previous tag's
          # conformance/matrix.json. A shallow checkout carries no tag to
          # read, and the gate would let a second failure through as a first.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Held again: the reviewer may have waited hours, and a tag can appear
      # or move in that time.
      - name: Hold the remote tag to the checked-out commit
        run: node scripts/release-tag.mjs "$TAG" $REQUIRE_TAG
      # Writes release-notes.md and copies the notices the tarballs carry.
      - name: Hold the versions and the matrix to the tag
        run: node scripts/release-prepare.mjs "$TAG"
      # On a tag, a new name with no credential refuses the run here, and a
      # credential that is set is asked whether it is live — `npm whoami`
      # answers in a second what the upload would otherwise answer after the
      # tiers, for a token that expired or was cut on the wrong scope.
      - name: Ask npm which names are a first publish, and whether the credential for one is live
        run: |
          node scripts/first-publish.mjs $REQUIRE_CREDENTIAL
          if [ -n "$NODE_AUTH_TOKEN" ]; then npm whoami --registry https://registry.npmjs.org; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REQUIRE_CREDENTIAL: ${{ github.event_name == 'push' && '--require-credential' || '' }}
      # Whether ci.yml's `full` job already proved this exact commit: a green
      # check on the SHA, made by a run of that workflow on that SHA, is the
      # same tree, toolchains and suite this job would run again, and a
      # rehearsal and a tag run each spent forty minutes repeating it before
      # their first packaging step. On that proof the tiers below are
      # skipped and the proving run is named; on a commit with no such
      # check — one no pull request carried — they run as before. What only
      # this workflow does runs on every run: the build, the packed smokes
      # and the two toolchains they need, the publish, the round trip, the
      # release. The operator's verdict A on #618; the decision page *The
      # release trusts the commit's green check*.
      - name: Ask CI whether it already proved this commit
        id: proof
        run: node scripts/tiers-proven.mjs "$(git rev-parse 'HEAD^{commit}')" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: haskell-actions/setup@v2
        if: steps.proof.outputs.proven != 'true'
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: '3.7.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
        if: steps.proof.outputs.proven != 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: steps.proof.outputs.proven != 'true'
      - run: cargo test --workspace --locked
        if: steps.proof.outputs.proven != 'true'
      - uses: actions/setup-java@v6
        if: steps.proof.outputs.proven != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        if: steps.proof.outputs.proven != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Install the C++ core toolchain
        if: steps.proof.outputs.proven != 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Build and test the C++ core
        if: steps.proof.outputs.proven != 'true'
        run: |
          cmake -S . -B .build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build .build/cpp --parallel 2
          ctest --test-dir .build/cpp --output-on-failure
      - name: Import Swift signing keys
        if: steps.proof.outputs.proven != 'true'
        run: curl --fail --silent --show-error --location --compressed --retry 3 --retry-delay 5 https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        if: steps.proof.outputs.proven != 'true'
        with:
          swift-version: "6.1.3"
      - run: node scripts/swift.mjs
        if: steps.proof.outputs.proven != 'true'
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
        if: steps.proof.outputs.proven != 'true'
      - name: Python unit suites
        if: steps.proof.outputs.proven != 'true'
        run: |
          python -m ruff check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m ruff format --check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m unittest discover -s duplex/py/tests
          python -m unittest discover -s runtime/py/tests
          python -m unittest discover -s conformance/python -p 'test_*.py'
      - name: Python installed wheel
        if: steps.proof.outputs.proven != 'true'
        run: python scripts/smoke-python.py
      - run: pnpm -r check
        if: steps.proof.outputs.proven != 'true'
      - run: pnpm -r test
        if: steps.proof.outputs.proven != 'true'
      - run: stack --system-ghc --no-install-ghc --stack-yaml conformance/haskell/stack.yaml test
        if: steps.proof.outputs.proven != 'true'
      - run: node scripts/haskell-smoke.mjs
        if: steps.proof.outputs.proven != 'true'
      # Eight native testee builds and the complete star need an overall
      # budget beyond the default ten minutes, as in ci.yml.
      - run: go test -timeout 25m ./...
        if: steps.proof.outputs.proven != 'true'
      # The adapter at otel/go and the profile at auth/go are modules of
      # their own, released by a tag each beside this one; the commit is
      # proved with them green, by CI or here.
      - run: go test ./...
        if: steps.proof.outputs.proven != 'true'
        working-directory: otel/go
      - run: go test ./...
        if: steps.proof.outputs.proven != 'true'
        working-directory: auth/go
      - run: pnpm -r build
      # What is about to be published, installed from outside the workspace
      # by the getting-started example: the tarballs by path and the Go
      # module from a proxy laid out of this tree. It runs on a rehearsal as
      # well as on a tag, needs no registry and no tag of its own, and is
      # the last thing between a green tree and an upload that cannot be
      # taken back.
      - name: Install what is about to be published
        run: node scripts/smoke-packed.mjs
      - run: node scripts/smoke-rust-packed.mjs
      - name: Publish to npm
        # On a rehearsal this packs each tarball, mints the provenance
        # attestation and stops short of the upload. On a re-run of a tag
        # whose upload succeeded, pnpm skips every version the registry
        # already serves.
        run: |
          node scripts/release-tag.mjs "$TAG" $REQUIRE_TAG
          pnpm -r publish --access public --no-git-checks --provenance $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
      # The round trip, once there is something to install: the same
      # example, after waiting up to thirty minutes for npm and the Go proxy
      # to serve the release, with nothing laid for it and nothing overridden.
      # Its failure fails the run and files an issue naming the tag, because
      # by now the tag exists and the packages are on npm. It runs before the
      # GitHub release is created, so that the release page announces what
      # the round trip has held, and a red round trip is re-run with
      # `gh run rerun --failed` rather than left red.
      - name: The round trip against what was published
        if: github.event_name == 'push'
        run: node scripts/smoke-registry.mjs "$TAG" --open-issue
        env:
          GH_TOKEN: ${{ github.token }}
      # Idempotent: a re-run after a red round trip finds the release it made
      # and leaves it.
      - name: Create the GitHub release
        if: github.event_name == 'push'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "the release $TAG exists; this run leaves it"
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: What a rehearsal did not do
        if: github.event_name == 'workflow_dispatch'
        run: echo "rehearsed $TAG — nothing was published, no release was created, and the round trip against the registries did not run"
