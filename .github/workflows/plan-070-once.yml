name: prepare approved 0.7.0 planning metadata
on:
  push:
    branches: ['planning/issue-345-milestone-070']
    paths: ['.github/workflows/plan-070-once.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: planning-issue-345-milestone-070
  cancel-in-progress: false
jobs:
  metadata:
    if: github.repository == 'Bitspark/nightseam'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile only the approved milestone, children and acceptance edges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = 'Bitspark/nightseam'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/planning/issue-345-milestone-070'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10', 'User-Agent': 'nightseam-approved-planning'}
          def api(method, path, data=None):
              req = urllib.request.Request(base + path, data=None if data is None else json.dumps(data).encode(), headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
              if method != 'GET': time.sleep(1)
              return json.loads(raw) if raw else None
          def pages(path):
              result = []
              for page in range(1, 21):
                  rows = api('GET', path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  result.extend(rows)
                  if len(rows) < 100: return result
              raise RuntimeError('pagination bound exceeded')
          milestone = api('GET', '/milestones/7')
          assert milestone['title'] == '0.7.0' and milestone['state'] == 'open'
          children = [336, 337, 348, 351, 353, 354, 355, 356, 357, 358, 359]
          blockers = {337: [336, 351, 355], 353: [336, 348, 351], 354: [336, 348, 351], 356: [337, 353, 354, 321, 323], 357: [356], 358: [357, 336], 359: [358]}
          numbers = sorted(set([345] + children + [n for group in blockers.values() for n in group]))
          issues = {n: api('GET', f'/issues/{n}') for n in numbers}
          for n in [345] + children:
              row = issues[n]
              if 'pull_request' in row: raise RuntimeError('expected issue')
              if row.get('milestone') and row['milestone']['number'] != 7: raise RuntimeError(f'issue {n} has another milestone')
              issues[n] = api('PATCH', f'/issues/{n}', {'milestone': 7, 'type': 'Epic' if n == 345 else 'Task'})
          attached = {r['id'] for r in pages('/issues/345/sub_issues')}
          for n in children:
              if issues[n]['id'] not in attached:
                  api('POST', '/issues/345/sub_issues', {'sub_issue_id': issues[n]['id'], 'replace_parent': False})
          for n, dependencies in blockers.items():
              present = {r['id'] for r in pages(f'/issues/{n}/dependencies/blocked_by')}
              for dependency in dependencies:
                  if issues[dependency]['id'] not in present:
                      api('POST', f'/issues/{n}/dependencies/blocked_by', {'issue_id': issues[dependency]['id']})
          verified_children = {r['number'] for r in pages('/issues/345/sub_issues')}
          assert set(children).issubset(verified_children)
          for n, dependencies in blockers.items():
              actual = {r['number'] for r in pages(f'/issues/{n}/dependencies/blocked_by')}
              assert set(dependencies).issubset(actual), (n, actual)
          result = {'milestone': milestone['html_url'], 'milestone_number': 7, 'epic': 345, 'children': children, 'acceptance_blockers': blockers, 'changed_source_on_main': False}
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Verified approved planning metadata\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
