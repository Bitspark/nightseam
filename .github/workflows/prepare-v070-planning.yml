# One-off reconciliation of this pass's metadata, only on its admin branch.
# No checkout, no production edits, no custom secrets, no reparenting.
name: reconcile v0.7.0 planning metadata
on:
  push:
    branches: [issue-346-v070-planning-metadata]
    paths: [.github/workflows/prepare-v070-planning.yml]
permissions:
  issues: write
concurrency:
  group: prepare-v070-planning-metadata
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'Bitspark/nightseam'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile only this pass's records with canonical epic 345
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          base = 'https://api.github.com/repos/Bitspark/nightseam'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'nightseam-planning-reconciliation'}
          def api(path, method='GET', payload=None, missing=False):
              req = urllib.request.Request(base + path, data=None if payload is None else json.dumps(payload).encode(), headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      result = json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if missing and exc.code == 404:
                      return None
                  raise RuntimeError(f'{method} {path}: {exc.code}: {exc.read().decode()}') from None
              if method != 'GET':
                  time.sleep(0.5)
              return result
          root = api('/issues/345')
          assert root['state'] == 'open' and root['milestone']['number'] == 7
          m = api('/milestones/7')
          assert m['title'] == '0.7.0' and m['state'] == 'open'
          description = m.get('description') or ''
          marker = '\n\nPlanning alignment (2026-09-21):\nOpt-in identity and expiring delegated authority over wires. Planning epic #346;'
          if marker in description:
              before, tail = description.split(marker, 1)
              end = 'No due date or release-publication authorization is implied.'
              if end not in tail:
                  raise RuntimeError('Unexpected description; refusing broad edit')
              after = tail.split(end, 1)[1]
              clean = before + after
              assert '#345' in clean
              api('/milestones/7', 'PATCH', {'description': clean})
              print('REMOVED only duplicate #346 description paragraph', flush=True)
          for n in [347, 350, 352]:
              issue = api(f'/issues/{n}')
              if issue['state'] != 'open':
                  print('SKIP closed issue', n, flush=True)
                  continue
              body = issue.get('body') or ''
              fixed = re.sub(r'#346\b', '#345', body)
              fixed = re.sub(r'#349\b', '#348', fixed)
              if fixed != body:
                  again = api(f'/issues/{n}')
                  if again['body'] != body:
                      print('SKIP concurrent body edit', n, flush=True)
                  else:
                      api(f'/issues/{n}', 'PATCH', {'body': fixed})
                      print('CANONICAL REFERENCES', n, flush=True)
              current = api(f'/issues/{n}')
              if current.get('milestone') and current['milestone']['number'] != 7:
                  raise RuntimeError(f'#{n} has another milestone; refusing to move')
              if not current.get('milestone'):
                  api(f'/issues/{n}', 'PATCH', {'milestone': 7})
              parent = api(f'/issues/{n}/parent', missing=True)
              if parent is None:
                  api('/issues/345/sub_issues', 'POST', {'sub_issue_id': current['id'], 'replace_parent': False})
                  parent = api(f'/issues/{n}/parent')
              if parent['number'] != 345:
                  print('PRESERVED other parent', n, parent['number'], flush=True)
              else:
                  print('VERIFIED CHILD', n, 'parent 345', flush=True)
          summary = {'milestone': api('/milestones/7'), 'canonical_epic': 345, 'duplicate_epic_state': api('/issues/346')['state'], 'duplicate_spec_state': api('/issues/349')['state']}
          summary['milestone'] = {k: summary['milestone'].get(k) for k in ['number','title','html_url','description','state','due_on','open_issues','closed_issues']}
          print('VERIFIED', json.dumps(summary), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Canonical planning reconciliation\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
