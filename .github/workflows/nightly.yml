# The full matrix: every language against every other, not only against the
# reference. The star — every language against Go on either side — is what CI
# runs on a pull request, because it is the gate a language passes to have
# joined and it is what a change can break. The full matrix is larger than the
# star by the square of the languages and finds one thing the star cannot: two
# non-reference languages disagreeing about something Go tolerates, which is
# the scenario being under-specified rather than either language being wrong.
#
# That is a slow thing to learn and never an urgent one, so it runs nightly
# rather than on a pull request, and its result is an issue per failing
# scenario rather than a red pull request nobody can act on.
name: nightly

on:
  schedule:
    # 03:17 UTC: off the hour, since everything scheduled on it contends for
    # the same runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # scripts/nightly-issues.mjs opens or updates one issue per failing
  # scenario, with the repository's own token.
  issues: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Python unit suites
        run: |
          python -m ruff check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m ruff format --check duplex/py runtime/py conformance/python scripts/smoke-python.py
          python -m unittest discover -s duplex/py/tests
          python -m unittest discover -s runtime/py/tests
          python -m unittest discover -s conformance/python -p 'test_*.py'
      - name: Python installed wheel
        run: python scripts/smoke-python.py
      - run: pnpm install --frozen-lockfile
      - run: node scripts/smoke-rust-packed.mjs
      # -json so that the failures can be read out by scenario rather than
      # scraped; the run is expected to fail, and what it failed at is the
      # output, so the step keeps going and the issues are what reports it.
      - name: The full matrix
        continue-on-error: true
        env:
          NIGHTSEAM_MATRIX: "1"
        run: go test -json ./conformance/go -run TestMatrix -count=1 -timeout 30m > matrix-run.json
      # A run that produced no test at all did not fail the matrix, it failed
      # to be made — a toolchain missing, a testee that would not build — and
      # that is the one thing here worth a red schedule, since it is the one
      # thing no issue would be opened for.
      - name: The run was made
        run: |
          node -e '
            const lines = require("node:fs").readFileSync("matrix-run.json", "utf8").split("\n");
            const ran = lines.some(line => {
              try { const e = JSON.parse(line); return e.Test && (e.Action === "pass" || e.Action === "fail"); } catch { return false; }
            });
            if (!ran) {
              console.error("::error::the full matrix ran no scenario; the run failed to be made rather than failing");
              console.error(lines.slice(-40).join("\n"));
              process.exit(1);
            }
          '
      - name: Open or update an issue per failing scenario
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/nightly-issues.mjs matrix-run.json \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # The run's own log, for a failure the issues cannot carry whole. The
      # matrix.json a TestMatrix run leaves in the workspace is the artifact
      # of that one filtered run and not the matrix, so it is not kept here:
      # the matrix is what CI's full job writes and what `main` carries.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-run
          path: matrix-run.json
