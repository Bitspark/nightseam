name: Something is wrong
description: A defect in a runtime, the generator or the generated code
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability does not go here — SECURITY.md says how to report one
        privately.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen instead
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - duplex (the seam)
        - runtime (the peer of the profile)
        - tunnel (channels over one peer)
        - live (callable bindings over one peer)
        - the generator (nightseam generate / check / validate / init)
        - the generated code
        - the documentation
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      multiple: true
      options:
        - Go
        - TypeScript
        - Both
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: How to observe it
      description: |
        The smallest thing that shows it. A failing test is best; a run over
        the in-memory pipe needs no network. For the generator, the tier
        files of the family and the command.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The npm package version, the Go module version or tag, or the commit.
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Surface
      description: The exported names the fix adds or changes, or "None".
    validations:
      required: true
  - type: textarea
    id: held-by
    attributes:
      label: Held by
      description: The regression test that will hold the fix, named; write it before the change.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Provenance
      description: The report, issue or decision this defect came from.
    validations:
      required: true
  - type: input
    id: waits
    attributes:
      label: Waits on
      description: The prerequisite issues as "#N, #M", or "Nothing". Keep context in a separate paragraph outside this field.
    validations:
      required: true
  - type: input
    id: touches
    attributes:
      label: Touches
      description: "The directories or files this fix edits, as backticked paths. The PR scope check reports departures without refusing them."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Go, Node and OS
      placeholder: go1.25.0, node 22.12.0, Windows 11
