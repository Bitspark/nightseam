name: Lane
description: A unit of work of a size one session lands by itself
type: Task
body:
  - type: markdown
    attributes:
      value: |
        The form is COLLABORATION.md's. Fill what you can; a lane that cannot
        yet say what holds it is a design question, not a lane — use the
        Design form for that instead.
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, in the terms of the code.
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Surface
      description: The exported names it adds or changes, spelled out. "None" if it changes no exported name.
    validations:
      required: true
  - type: textarea
    id: held-by
    attributes:
      label: Held by
      description: The tests that hold it, named. The test that guards the invariant is written first.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Provenance
      description: What this was decomposed from — an issue, a decision, a report.
    validations:
      required: true
  - type: input
    id: waits
    attributes:
      label: Waits on
      description: The issues that land before this one, as "#N, #M", or "nothing".
      placeholder: "nothing"
    validations:
      required: true
  - type: input
    id: touches
    attributes:
      label: Touches
      description: "The directories this lane edits, as backticked paths: `runtime/go`, `docs/wire/tunnel.md`. The scope check on the PR reads this line and notes, never refuses, a file outside it."
      placeholder: "`tunnel/go`, `tunnel/ts`, `docs/wire/tunnel.md`"
    validations:
      required: true
  - type: dropdown
    id: parity
    attributes:
      label: Parity
      description: Every runtime component exists in both languages and is held to one suite.
      options:
        - Both languages, in this lane
        - The generator or the docs only — parity does not apply
        - An additional-language port, following docs/languages/tiers.md
    validations:
      required: true
