<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
{{.Fonts}}
<style>
{{.Style}}
{{.Tokens}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="masthead">
  <a class="wordmark" href="#/">NIGHTSEAM <span>/ ATLAS</span></a>
  <div class="tools">
    <label class="lens-label">Show names as <select id="lens" aria-label="Name lens"><option value="wire">wire</option></select></label>
    <button id="find" aria-haspopup="dialog">Find <kbd>/</kbd></button>
    <button id="theme" aria-label="Switch color theme">◐</button>
  </div>
</header>
<nav id="families" class="families" aria-label="Families"></nav>
<main id="content" tabindex="-1"><noscript>This atlas needs JavaScript to explore its embedded specification. The generated Markdown pages are available alongside it.</noscript></main>
<footer class="footer"><span>THE SPECIFICATION, AT EVERY SCALE.</span><span>Generated by Nightseam · {{.Title}}</span></footer>
<dialog id="finder" aria-labelledby="finder-title">
  <div class="dialog-head"><h2 id="finder-title">Find in the atlas</h2><button data-close="finder" aria-label="Close finder">×</button></div>
  <input id="search" type="search" placeholder="A family, exchange, type or error…" aria-label="Search the specification" autocomplete="off">
  <div id="results" aria-live="polite"></div>
</dialog>
<dialog id="drawer" aria-labelledby="drawer-title">
  <div class="dialog-head"><nav id="breadcrumbs" aria-label="Type breadcrumbs"></nav><button data-close="drawer" aria-label="Close type drawer">×</button></div>
  <div id="type-detail"></div>
</dialog>
<script type="application/json" id="nightseam-document">{{.Document}}</script>
<script type="module">
{{.Builders}}
{{.Page}}
</script>
</body>
</html>
